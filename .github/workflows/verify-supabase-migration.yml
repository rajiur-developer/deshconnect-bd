name: Verify Supabase migration

on:
  push:
    branches:
      - fix/supabase-full-backend-migration
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_INSFORGE_URL: https://legacy.example.invalid
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_R2_PUBLIC_URL: https://media.example.invalid
      NEXT_PUBLIC_APP_URL: https://deshconnect.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
